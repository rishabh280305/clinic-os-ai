name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Lint with annotations
        shell: bash
        run: |
          set +e
          npx eslint . --format json > eslint-report.json
          status=$?
          node -e 'for (const file of JSON.parse(require("fs").readFileSync("eslint-report.json","utf8"))) for (const item of file.messages) console.log(`::${item.severity===2?"error":"warning"} file=${file.filePath},line=${item.line||1},col=${item.column||1}::${item.message} (${item.ruleId||"eslint"})`)'
          exit $status
      - run: npm test
      - run: npm run build
